name: Build Garage Tested Casino V5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Garage Tested Casino V5
        run: |
          rm -rf GoldCoinCasino
          unzip -o GarageTestedCasino_v5_source.zip

      - name: Build debug APK
        working-directory: GoldCoinCasino
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp GoldCoinCasino/app/build/outputs/apk/debug/app-debug.apk GarageTestedCasino-v5.apk
          ls -lh GarageTestedCasino-v5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GarageTestedCasino-V5-APK
          path: GarageTestedCasino-v5.apk
          if-no-files-found: error
