name: Build Gold Coin Casino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Gold Coin Casino
        run: |
          rm -rf GoldCoinCasino
          unzip -o GoldCoinCasino_Android_v1.0.zip

      - name: Patch dependencies and JVM settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("GoldCoinCasino/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "compileSdk = 37",
              "compileSdk = 36"
          )

          s = s.replace(
              'implementation(platform("androidx.compose:compose-bom:2026.08.00"))',
              'implementation(platform("androidx.compose:compose-bom:2026.04.01"))'
          )

          s = s.replace(
              'implementation("androidx.activity:activity-compose:1.13.0")',
              'implementation("androidx.activity:activity-compose:1.12.1")'
          )

          if "compileOptions {" not in s:
              s = s.replace(
                  "    buildFeatures { compose = true }",
                  "    compileOptions {\n"
                  "        sourceCompatibility = JavaVersion.VERSION_17\n"
                  "        targetCompatibility = JavaVersion.VERSION_17\n"
                  "    }\n\n"
                  "    buildFeatures { compose = true }"
              )
          else:
              s = s.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17"
              )

          if "jvmToolchain(17)" not in s:
              s += "\n\nkotlin {\n    jvmToolchain(17)\n}\n"

          p.write_text(s)

          print("---- PATCHED build.gradle.kts ----")
          print(s)
          PY

      - name: Build debug APK
        working-directory: GoldCoinCasino
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp GoldCoinCasino/app/build/outputs/apk/debug/app-debug.apk GoldCoinCasino.apk
          ls -lh GoldCoinCasino.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldCoinCasino-APK
          path: GoldCoinCasino.apk
          if-no-files-found: error
