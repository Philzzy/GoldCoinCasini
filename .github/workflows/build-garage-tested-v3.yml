name: Build Garage Tested Casino V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Garage Tested Casino V3
        run: |
          rm -rf GarageTestedCasino
          unzip -o GarageTestedCasino_v3_source.zip
          echo "Extracted files:"
          ls -la

      - name: Find project folder
        id: project
        shell: bash
        run: |
          if [ -d "GarageTestedCasino" ]; then
            echo "dir=GarageTestedCasino" >> "$GITHUB_OUTPUT"
          elif [ -d "GoldCoinCasino" ]; then
            echo "dir=GoldCoinCasino" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 2 -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
            FOUND=${FOUND#./}
            if [ -z "$FOUND" ]; then
              echo "Could not locate Android project"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi
            echo "dir=$FOUND" >> "$GITHUB_OUTPUT"
          fi

      - name: Show project
        run: |
          echo "Project directory: ${{ steps.project.outputs.dir }}"
          find "${{ steps.project.outputs.dir }}" -maxdepth 3 -type f | sort | head -100

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Find and prepare APK
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not found."
            find "${{ steps.project.outputs.dir }}" -type f | sort | tail -100
            exit 1
          fi

          echo "Found APK: $APK"
          cp "$APK" GarageTestedCasino-v3.apk
          ls -lh GarageTestedCasino-v3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GarageTestedCasino-V3-APK
          path: GarageTestedCasino-v3.apk
          if-no-files-found: error
