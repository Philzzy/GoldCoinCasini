name: Build Gold Coin Casino APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK 37
        uses: android-actions/setup-android@v3

      - name: Install platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Extract app source
        run: unzip -o GoldCoinCasino_Android_v1.0.zip

      - name: Build debug APK
        working-directory: GoldCoinCasino
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp GoldCoinCasino/app/build/outputs/apk/debug/app-debug.apk GoldCoinCasino.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldCoinCasino-APK
          path: GoldCoinCasino.apk
