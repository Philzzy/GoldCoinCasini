name: Build Gold Coin Casino APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract app source
        run: unzip -o GoldCoinCasino_Android_v1.0.zip

      - name: Patch Android project for API 36 and Java 17
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("GoldCoinCasino/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = 37", "compileSdk = 36")
          s = s.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
          if "jvmTarget = "17"" not in s:
              if "kotlinOptions" in s:
                  import re
                  s = re.sub(r'kotlinOptions\s*\{[^}]*\}', 'kotlinOptions {\n        jvmTarget = "17"\n    }', s, flags=re.S)
              else:
                  s += '\n\nkotlinOptions {\n    jvmTarget = "17"\n}\n'
          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build debug APK
        working-directory: GoldCoinCasino
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        run: cp GoldCoinCasino/app/build/outputs/apk/debug/app-debug.apk GoldCoinCasino.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldCoinCasino-APK
          path: GoldCoinCasino.apk
